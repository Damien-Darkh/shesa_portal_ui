<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <title>Page not found - Employee Portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
  <script src="./vendor/lucide.min.js"></script>
</head>
<body>
<header id="site-header"></header>

  <main class="main-container">
    <div class="error-page">
      <div class="icon-box" style="background:var(--accent-light);color:var(--accent-text);">
        <i data-lucide="compass"></i>
      </div>
      <p class="code">404 · Not found</p>
      <h1 class="title" style="font-size:1.75rem;">This page doesn't exist</h1>
      <p class="description">The link may be broken, or the page may have moved. Check the URL, or head back to your dashboard.</p>
      <div class="btn-row" style="margin-top:.5rem;">
        <a href="index.html" class="btn btn-primary" style="width:auto;">Back to dashboard</a>
      </div>
    </div>
  </main>

  <script type="module" src="pages/404.js"></script>
</body>
</html>
