<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="./logo.svg">
  <title>Access denied - Employee Portal</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
  <script src="./vendor/lucide.min.js"></script>
</head>
<body>
<header id="site-header"></header>

  <main class="main-container">
    <div class="error-page">
      <div class="icon-box" style="background:#fef2f2;color:#dc2626;">
        <i data-lucide="shield-alert"></i>
      </div>
      <p class="code">403 · Forbidden</p>
      <h1 class="title" style="font-size:1.75rem;">You don't have access to this page</h1>
      <p class="description">Your account doesn't have permission to view this. If you think this is a mistake, contact an admin.</p>
      <p class="form-hint mono" id="err-detail" hidden></p><!-- Flask: {% if message %}{{ message }}{% endif %} -->
      <div class="btn-row" style="margin-top:.5rem;">
        <a href="index.html" class="btn btn-primary" style="width:auto;">Back to dashboard</a>
      </div>
    </div>
  </main>

  <script type="module" src="pages/403.js"></script>
</body>
</html>
